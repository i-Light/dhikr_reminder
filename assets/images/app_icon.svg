<?xml version="1.0" encoding="UTF-8"?>
<!-- THE app icon. The tray icon (and its grayed-out "closing" state) and the
     .exe's icon are all drawn from this one file at build/run time, so this is
     the only place to change it. Keep it square. This is a placeholder: a gold
     crescent on a dark disc. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D27A"/>
      <stop offset="1" stop-color="#B8862B"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="124" fill="#1B140B"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <circle cx="116" cy="128" r="66" fill="url(#gold)"/>
  <circle cx="146" cy="112" r="58" fill="#1B140B"/>
</svg>
