name: dhikr_reminder
description: "Dhikr Reminder: pops up a dhikr every few minutes, on Windows and Android, and lets you tap it out."
publish_to: 'none'
version: 1.0.0+6

environment:
  # Kept low on purpose: the language version here also picks the style `dart
  # format` uses (3.7 and up switched to a different one), and the code is
  # written in the older style. Raise it deliberately, together with a one-time
  # reformat, not as a side effect.
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

  # Ships the locale data AppLocalizations needs for `en` + `ar` (and the RTL
  # layout the Arabic strings depend on).
  flutter_localizations:
    sdk: flutter

  # State management: hand-written Riverpod providers, no codegen, matching
  # gratovo_toolbox (which this app's reminder code was lifted from).
  flutter_riverpod: ^3.4.2

  # The reminder card's mandala/frame-corner artwork.
  flutter_svg: ^2.2.1

  # Persists the dhikr list, the reminder interval and the next row id.
  shared_preferences: ^2.5.5

  # Pinned to the version flutter_localizations already resolves on this SDK,
  # so this doesn't introduce a second, conflicting constraint.
  intl: ^0.20.3
  tray_manager: ^0.5.2
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2

  # The auto-updater (lib/core/update/): the running app's own version, and the
  # SHA-256 the downloaded installer is checked against.
  package_info_plus: ^10.2.2
  crypto: ^3.0.7
  hijri: ^3.0.1

  # Opens the bug report and the Play Store page in the browser (or the Play
  # Store app); on Windows it is ShellExecute.
  url_launcher: ^6.3.3

  # The phone or PC model that goes into a bug report.
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0 <6.0.0'

flutter:
  uses-material-design: true

  # Drives `flutter gen-l10n` (see l10n.yaml), which generates
  # lib/l10n/gen/app_localizations.dart from lib/l10n/app_en.arb + app_ar.arb
  # on every `flutter pub get` / `flutter run`.
  generate: true

  fonts:
    # The app's default face: the theme (core/theme/app_theme.dart) uses it for
    # all UI text. Only the weights Material 3 asks for (regular, medium, bold)
    # plus semibold are bundled, each one is ~100 KB in the app.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

    # The dhikr texts' face: the reminder card and the library entries.
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Variable.ttf

  assets:
    # The reminder card's frame, see border_frame.dart.
    - assets/images/frame_corner.svg
    - assets/images/mandala_background.svg
    # The app icon: the tray icon and the .exe icon are both drawn from it, see
    # core/window/svg_icon.dart and tool/generate_app_icon.dart.
    - assets/images/logo.svg
