name: dhikr_reminder
description: "Dhikr Reminder â€” a standalone desktop app that pops a dhikr on screen every few minutes and lets you tap it out."
publish_to: 'none'
version: 0.1.1+2

environment:
  # Same floor as gratovo_toolbox: the reminder overlay leans on `withValues(alpha:)`,
  # `OverlayPortal` and `BlurStyle.outer`, all of which need a recent Flutter.
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

  # Ships the locale data AppLocalizations needs for `en` + `ar` (and the RTL
  # layout the Arabic strings depend on).
  flutter_localizations:
    sdk: flutter

  # State management â€” hand-written Riverpod providers, no codegen, matching
  # gratovo_toolbox (which this app's reminder code was lifted from).
  flutter_riverpod: ^3.4.2

  # The reminder card's mandala/frame-corner artwork.
  flutter_svg: ^2.2.1

  # Persists the dhikr list, the reminder interval and the next row id.
  shared_preferences: ^2.5.5

  # Pinned to the version flutter_localizations already resolves on this SDK,
  # so this doesn't introduce a second, conflicting constraint.
  intl: ^0.20.3
  tray_manager: ^0.5.2
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2

  # The auto-updater (lib/core/update/): the running app's own version, and the
  # SHA-256 the downloaded installer is checked against.
  package_info_plus: ^9.0.0
  crypto: ^3.0.7
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  hijri: ^3.0.1

# See packages/flutter_local_notifications_windows/README_VENDORED.md.
dependency_overrides:
  flutter_local_notifications_windows:
    path: packages/flutter_local_notifications_windows

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0 <6.0.0'

flutter:
  uses-material-design: true

  # Drives `flutter gen-l10n` (see l10n.yaml) â€” generates
  # lib/l10n/gen/app_localizations.dart from lib/l10n/app_en.arb + app_ar.arb
  # on every `flutter pub get` / `flutter run`.
  generate: true

  fonts:
    # The reminder card's Arabic text (see `fontFamily: 'Naksh'` in
    # dhikr_reminder_overlay.dart). This is the one asset font the reminder
    # actually renders with; gratovo_toolbox's other fonts belong to screens
    # this app doesn't have.
    - family: Naksh
      fonts:
        - asset: assets/fonts/PanoramaNaskhMobile-Regular.otf

    # The app's default face: the theme (core/theme/app_theme.dart) uses it for
    # all UI text. Only the weights Material 3 asks for (regular, medium, bold)
    # plus semibold are bundled — each one is ~100 KB in the app.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

    # The dhikr texts' face: the reminder card and the library entries.
    - family: AliMeshref
      fonts:
        - asset: assets/fonts/ali-meshref.ttf

  assets:
    # The reminder card's frame â€” see border_frame.dart.
    - assets/images/frame_corner.svg
    - assets/images/mandala_background.svg
    # The app icon: the tray icon and the .exe icon are both drawn from it, see
    # core/window/svg_icon.dart and tool/generate_app_icon.dart.
    - assets/images/logo.svg
